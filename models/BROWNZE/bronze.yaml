version: 2

models:

  - name: categories
    columns:
      - name: category_id
        data_tests:
          - unique
          - not_null

      - name: category_name
        data_tests:
          - not_null
          - dbt_utils.not_empty_string

  - name: customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

      - name: email
        data_tests:
          - unique
          - not_null

  - name: products

    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

      - name: sku
        data_tests:
          - unique
          - not_null

      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('categories')
                field: category_id

      - name: price
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: stock_quantity
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000

  - name: stores
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null

  - name: orders

    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('customers')
                field: customer_id

      - name: store_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stores')
                field: store_id

      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - PENDING
                  - SHIPPED
                  - DELIVERED
                  - CANCELLED

      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - UNPAID
                  - PAID
                  - REFUNDED

      - name: total_amount
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: order_items

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - product_id

    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null

      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('orders')
                field: order_id

      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('products')
                field: product_id

      - name: quantity
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10